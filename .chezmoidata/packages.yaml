packages:
  scoop:
    buckets:
      - "extras"
      - "nerd-fonts"
      - "versions"
    pkgs:
      - "main/7zip"
      - "main/antigravity-cli"
      - "main/bat"
      - "main/delta"
      - "main/eza"
      - "main/fastfetch"
      - "main/fd"
      - "main/flameshot"
      - "main/fzf"
      - "main/git"
      - "main/gnupg"
      - "main/jq"
      - "main/maven"
      - "main/msys2"
      - "main/nodejs"
      - "main/openvpn"
      # 包含 C++ 扩展库 预编译，最新版本需要自行编译
      - "main/python312"
      - "main/ripgrep"
      - "main/starship"
      - "main/unrar"
      - "main/wget"
      - "main/zoxide"

      - "extras/emacs"
      - "extras/lazygit"
      - "extras/powertoys"
      - "extras/scoop-completion"
      - "extras/ultravnc"
      - "extras/wsl-ssh-pageant"

      # - "extras/komorebi"
      # - "extras/vcxsrv"
      # - "extras/yasb"

      - "nerd-fonts/JetBrainsMono-NF-Mono"
      - "nerd-fonts/LXGWWenKai"
      - "nerd-fonts/Maple-Mono-NF-CN"

      - "versions/neovim-nightly"
      - "versions/wezterm-nightly"

    importRegistry:
      - '$env:USERPROFILE\scoop\apps\7zip\current\install-context.reg'
      - '$env:USERPROFILE\scoop\apps\git\current\install-associations.reg'
      - '$env:USERPROFILE\scoop\apps\git\current\install-context.reg'
      - '$env:USERPROFILE\scoop\apps\pwsh\current\install-explorer-context.reg'
      - '$env:USERPROFILE\scoop\apps\pwsh\current\install-file-context.reg'
      - '$env:USERPROFILE\scoop\apps\wezterm\current\install-context.reg'
      # - '$env:USERPROFILE\scoop\apps\vscode\current\install-associations.reg'
      # - '$env:USERPROFILE\scoop\apps\vscode\current\install-context.reg'
      # - '$env:USERPROFILE\scoop\apps\vscode\current\install-github-integration.reg'
      # - '$env:USERPROFILE\scoop\apps\windows-terminal\current\install-context.reg'
  winget:
    - "Brave.Brave"
    - "Microsoft.PowerShell"
    - "Rime.Weasel"
  psGallery:
    - "PSFzf"
    - "PsReadLine"
    # - "CompletionPredictor"
