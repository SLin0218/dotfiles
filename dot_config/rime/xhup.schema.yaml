# Rime schema settings
# encoding: utf-8

schema:
  schema_id: xhup
  name: 小鹤音形
  version: "v1.26.9c"
  icon: "icons/flypy_icon.ico"
  ascii_icon: "icons/flypy_ascii_icon.ico"
  full_icon: "icons/flypy_ascii_icon.ico"
  half_icon: "icons/flypy_ascii_icon.ico"
  author:
    - 方案设计：何海峰 <flypy@qq.com>
    - 方案调整：水猫 <kchen0x@gmail.com>
  description: |
    小鹤音形（对齐官方清风便携版 v1.26.9c 规范）
  dependencies:
    - xhup_reverse

# 使用雾凇默认的标点符号
punctuator:
  import_preset: default

switches:
  - name: ascii_mode
    reset: 0
    states: [中, A]
  - name: full_shape
    states: [半, 全]
  - name: simplification
    states: [简, 繁]
    reset: 0
  - name: ascii_punct
    states: [。，, ．，]
    reset: 0
  - name: short_hints #滤镜
    reset: 1
    states: [🙈, 🐵]

engine:
  processors:
    - lua_processor@*xhup/shortcut_processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator # 码表
    - lua_translator@*xhup/date_translator # Lua 日期
    - lua_translator@*xhup/time_translator # Lua 时间
    - lua_translator@*xhup/shortcut_translator # Lua 直通车
    - reverse_lookup_translator@xhup_reverse
    - history_translator@history # 重复上屏
  filters:
    - simplifier
    - simplifier@simplification
    - simplifier@short_hints #滤镜
    - uniquifier

# 拼写设定
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;'" # 不直接上屏的标点
  initials: ";abcdefghijklmnopqrstuvwxyz" # 可以作为第一位的引导词
  finals: "'"
  # delimiter: " '"
  max_code_length: 4
  auto_select: true #顶字上屏
  auto_select_pattern: ^;.$|^\w{4}$
  auto_clear: max_length #manual|auto|max_length 空码按下一键确认清屏|空码自动清|达到最长码时后码顶上清屏

# 翻译器，小鹤音形
translator:
  dictionary: xhup # 挂载词库 xhup.dict.yaml
  enable_charset_filter: false
  enable_sentence: false # 是否启用造句模式
  enable_completion: false # 编码提示开关
  enable_user_dict: false
  disable_user_dict_for_patterns:
    - "^z.*$"

# 重复上屏
history:
  input: ;f
  size: 1 # 重复前几次上屏
  initial_quality: 1 # 首选

# 简繁转换器
simplification:
  opencc_config: s2tw.json # s2t.json | s2hk.json | s2tw.json | s2twp.json
  option_name: simplification
  tips: all # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。

short_hints:
  opencc_config: short_hints.json
  option_name: short_hints
  show_in_comment: true #作为注解在后面显示
  comment_format:
    - xform/^/〔/
    - xform/$/〕/
  tips: all
  # tags:
  #   - abc
  #   - tiger
  #   - tigress
  #   - xhup
  # - reverse_lookup

# 反查词库
xhup_reverse:
  dictionary: xhup_reverse
  comment_format:
    # - xform/^/〔/
    # - xform/$/〕/
    - xform/ / /

# 快捷键设置
key_binder:
  # import_preset: default # 从 default.yaml 继承通用的
  bindings: # 一些专用的快捷键
    - { when: has_menu, accept: Up, send: Page_Up }
    - { when: has_menu, accept: Down, send: Page_Down }
    - { when: has_menu, accept: Left, send: Up }
    - { when: has_menu, accept: Right, send: Down }
#   - { accept: bracketleft, send: bracketleft, when: paging } # 注销[上翻页
#   - { accept: bracketright, send: bracketright, when: has_menu } # 注销]下翻页
#   - { accept: comma, send: comma, when: paging } # 注销逗号翻页
#   - { accept: period, send: period, when: has_menu } # 注销句号翻页
#   - { accept: semicolon, send: "2", when: has_menu } # 分号次选
#  - {accept: Release+semicolon, send: semicolon, when: has_menu} # 如启用此行，则分号引导符号功能无效
# - { accept: Release+period, send: period, when: composing } # 句号顶屏
# - { accept: Release+comma, send: comma, when: composing } # 逗号顶屏
# - { accept: "Tab", send: Escape, when: composing } # 注销 Tab 键（default 可以通过 Tab 来切换光标至下一个拼音）
# - { accept: "Shift_R", send: Escape, when: composing } # 注销右侧 Shift 键，用来进行输入法切换中英（配合 Karabiner）
# - { accept: "Shift+space", toggle: full_shape, when: always } # 切换全半角
# - { accept: "Control+period", toggle: ascii_punct, when: always } # 切换中英标点
# - { accept: "Control+j", toggle: simplification, when: always } # 切换简繁

# 识别器
recognizer:
  import_preset: default # 从 default.yaml 继承通用的
  patterns:
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$" # 中文状态可以混合输入大写英文
    # uppercase: ""                       # 中文状态大写锁定直接上屏
    reverse_lookup: "[a-z`]*`+[a-z`]*"
    punct: ""
    expression: "^=.*$"

menu:
  page_size: 5 # 候选项数

style:
  color_scheme: catppuccin_latte
  color_scheme_dark: catppuccin_mocha
  candidate_list_layout: linear

  preset_color_schemes:
    catppuccin_latte:
      name: Catppuccin Latte

      back_color: 0xE8E0DC # 候选条背景色 Crust
      border_color: 0xEFE9E6 # 边框色 Mantle
      text_color: 0x775F5C # 拼音行文字颜色 Subtext1
      label_color: 0x856F6C # 预选栏编号颜色 Subtext0
      candidate_text_color: 0x694F4C # 预选项文字颜色 Text
      hilited_back_color: 0xef3988 # 第一候选项背景背景色 Mauve
      hilited_candidate_text_color: 0xF5F1EF # 第一候选项文字颜色 Base
      hilited_candidate_label_color: 0xDAD0CC # 第一候选项编号颜色 Surface0
      hilited_text_color: 0xBEB0AC # 高亮拼音 (需要开启内嵌编码) Surface2
      hilited_comment_text_color: 0xDAD0CC # 注解文字高亮 Surface0
      comment_text_color: 0xBEB0AC # 拼音等提示文字颜色 Surface2

    catppuccin_mocha:
      name: Catppuccin Mocha

      back_color: 0x1B1111 # 候选条背景色 Crust
      border_color: 0x251818 # 边框色 Mantle
      text_color: 0xDEC2BA # 拼音行文字颜色 Subtext1
      label_color: 0xC8ADA6 # 预选栏编号颜色 Subtext0
      candidate_text_color: 0xF4D6CD # 预选项文字颜色 Text
      hilited_back_color: 0xF7A6CB # 第一候选项背景背景色 Mauve
      hilited_candidate_text_color: 0x2E1E1E # 第一候选项文字颜色 Base
      hilited_candidate_label_color: 0x443231 # 第一候选项编号颜色 Surface0
      hilited_text_color: 0x705B58 # 高亮拼音 (需要开启内嵌编码) Surface2
      hilited_comment_text_color: 0x443231 # 注解文字高亮 Surface0
      comment_text_color: 0x705B58 # 拼音等提示文字颜色 Surface2
